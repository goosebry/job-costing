<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Cost Entry - CostTrack Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

        }

            0% { transform: rotate(0deg); }

        .focus-glow:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
    </style>

                      "on-background": "#0b1c30",

                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#213145",
                      "surface-variant": "#d3e4fe",
                      "on-tertiary-fixed": "#002113",
                      "surface-container-low": "#eff4ff",
                      "primary-container": "#2563eb",
                      "outline-variant": "#c3c6d7",

<body class="bg-surface font-body-md text-on-surface">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[600px] rounded-xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="px-gutter py-4 border-b border-outline-variant flex justify-between items-center bg-white">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Add Cost Entry</h2>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-secondary">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content / Form Body -->
<div class="overflow-y-auto max-h-[768px] p-gutter">
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Job Dropdown -->
<div class="flex flex-col gap-1.5 md:col-span-2">
<label class="font-label-md text-label-md text-secondary">Job</label>
<select class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface appearance-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNjQ3NDhCIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik02IDlsNiA2IDYtNiIvPjwvc3ZnPg==')] bg-[length:20px_20px] bg-[right_8px_center] bg-no-repeat">
<option>4492-TX - Downtown Office Complex</option>
<option>4510-FL - Palm Harbor Bridge</option>
<option>4621-NY - Brooklyn Warehouse</option>
</select>
</div>
<!-- Date Picker -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Date</label>
<input class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface" type="date" value="2023-10-27"/>
</div>
<!-- Amount Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Amount</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-secondary">$</span>
<input class="w-full h-10 pl-7 pr-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<!-- Description Input (Required/Validation Error Example) -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary">Description <span class="text-error">*</span></label>
</div>
<input class="h-10 px-3 bg-white border border-error rounded-lg focus:ring-1 focus:ring-error focus:outline-none font-body-md text-on-surface" placeholder="e.g., Concrete pour for Level 2" type="text" value=""/>
<p class="text-error font-label-sm text-label-sm mt-0.5">Description is required for internal auditing.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Category Dropdown -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Cost Category</label>
<select class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface appearance-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNjQ3NDhCIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik02IDlsNiA2IDYtNiIvPjwvc3ZnPg==')] bg-[length:20px_20px] bg-[right_8px_center] bg-no-repeat">
<option>Direct Material</option>
<option>Subcontract</option>
<option>Equipment</option>
<option>Overhead</option>
</select>
</div>
<!-- Cost Code Dropdown -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Cost Code</label>
<select class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface appearance-none bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNjQ3NDhCIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik02IDlsNiA2IDYtNiIvPjwvc3ZnPg==')] bg-[length:20px_20px] bg-[right_8px_center] bg-no-repeat">
<option>03-3000 Concrete Pouring</option>
<option>03-3100 Formwork</option>
<option>03-3200 Rebar</option>
</select>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Vendor -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Vendor/Supplier</label>
<input class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface" placeholder="Enter vendor name" type="text"/>
</div>
<!-- Invoice Reference -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Invoice Reference</label>
<input class="h-10 px-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface" placeholder="INV-0000" type="text"/>
</div>
</div>
<!-- Notes Textarea -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Notes</label>
<textarea class="p-3 bg-white border border-outline-variant rounded-lg focus-glow font-body-md text-on-surface resize-none" placeholder="Additional details..." rows="3"></textarea>
</div>
<!-- Receipt Attachment -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary">Receipt Attachment</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-variant transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors mb-2" data-icon="cloud_upload">cloud_upload</span>
<p class="font-label-md text-label-md text-on-surface-variant">Click to upload or drag and drop</p>
<p class="font-label-sm text-label-sm text-secondary mt-1">PDF, JPG or PNG (max. 10MB)</p>
</div>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-gutter py-4 border-t border-outline-variant flex flex-col sm:flex-row justify-end items-center gap-3 bg-surface-container-lowest">
<button class="w-full sm:w-auto px-6 h-10 font-label-md text-label-md text-on-surface hover:bg-surface-variant rounded-lg transition-colors">
                    Cancel
                </button>
<button class="w-full sm:w-auto px-6 h-10 font-label-md text-label-md text-on-surface border border-outline-variant hover:bg-surface-container-low rounded-lg transition-colors">
                    Save as Draft
                </button>
<button class="w-full sm:w-auto px-6 h-10 font-label-md text-label-md bg-primary-container text-white rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-sm">
<div class="spinner"></div>
                    Submit
                </button>
</div>
</div>
</div>
<!-- Background Content Mockup (to show modal context) -->
<div class="p-margin-desktop space-y-8 blur-sm pointer-events-none">
<div class="flex justify-between items-center">
<h1 class="font-headline-lg text-headline-lg">Project Dashboard</h1>
<div class="h-10 w-32 bg-primary-container rounded-lg"></div>
</div>
<div class="grid grid-cols-3 gap-gutter">
<div class="h-40 bg-white border border-outline-variant rounded-xl"></div>
<div class="h-40 bg-white border border-outline-variant rounded-xl"></div>
<div class="h-40 bg-white border border-outline-variant rounded-xl"></div>
</div>
<div class="h-96 bg-white border border-outline-variant rounded-xl"></div>
</div>
</body></html>
