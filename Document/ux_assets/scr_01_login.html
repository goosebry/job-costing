<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - JobCost Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#bec6e0",
                        "surface-tint": "#0053db",
                        "on-tertiary-fixed": "#131b2e",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e1e2e4",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-secondary-container": "#54647a",
                        "on-surface-variant": "#434655",
                        "inverse-surface": "#2e3132",
                        "surface-bright": "#f8f9fb",
                        "primary-container": "#2563eb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-tertiary-container": "#eef0ff",
                        "outline": "#737686",
                        "outline-variant": "#c3c6d7",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-dim": "#d9dadc",
                        "primary": "#004ac6",
                        "background": "#f8f9fb",
                        "surface-variant": "#e1e2e4",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-fixed": "#dae2fd",
                        "on-primary-fixed": "#00174b",
                        "secondary-container": "#d0e1fb",
                        "tertiary-container": "#656d84",
                        "inverse-primary": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f0f1f3",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e7e8ea",
                        "surface-container": "#edeef0",
                        "on-background": "#191c1e",
                        "tertiary": "#4d556b",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary": "#505f76",
                        "surface-container-low": "#f3f4f6",
                        "surface": "#f8f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "md": "1rem",
                        "sm": "0.5rem",
                        "xs": "0.25rem",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "mono-data": ["JetBrains Mono"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .login-gradient {
            background: radial-gradient(circle at top left, #dbe1ff 0%, #f8f9fb 100%);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center p-container-margin login-gradient">
<div class="w-full max-w-md">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg p-xl space-y-lg">
<!-- Branding -->
<div class="flex flex-col items-center space-y-md">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="construction">construction</span>
</div>
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">JobCost Pro</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Precision Project Costing &amp; Analysis</p>
</div>
</div>
<!-- Form Section -->
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block px-xs" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="mail">mail</span>
</div>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder-outline focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block px-xs" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="lock">lock</span>
</div>
<input class="w-full pl-xl pr-12 py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder-outline focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary-container transition-all" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline font-bold transition-all" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-headline-md text-headline-md py-md rounded-lg shadow-sm hover:shadow-md active:translate-y-[1px] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Support/Divider -->
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-md">
<span class="bg-surface-container-lowest px-md text-on-surface-variant font-label-md">AUTHENTICATION REQUIRED</span>
</div>
</div>
<!-- Assistance -->
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Contact Administrator</a>
</p>
</div>
</div>
</main>
<!-- Footer Component from JSON -->
<footer class="w-full flex flex-col md:flex-row justify-between items-center px-lg py-md space-y-md md:space-y-0 bg-surface-bright border-t border-outline-variant">
<div class="flex items-center space-x-md">
<span class="font-body-md text-body-md text-on-surface-variant">© 2024 JobCost Pro Inc. All rights reserved.</span>
</div>
<div class="flex items-center space-x-lg">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Security</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">Status</a>
</div>
</footer>
</body></html>
