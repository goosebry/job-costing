<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#ffdbcd",
                    "background": "#faf8ff",
                    "secondary-fixed": "#dce2f3",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e7e7f3",
                    "surface": "#faf8ff",
                    "secondary-container": "#dce2f3",
                    "inverse-primary": "#b4c5ff",
                    "surface-container-highest": "#e1e2ed",
                    "on-secondary": "#ffffff",
                    "on-surface": "#191b23",
                    "tertiary": "#943700",
                    "surface-container-low": "#f3f3fe",
                    "inverse-surface": "#2e3039",
                    "outline": "#737686",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#ffede6",
                    "surface-variant": "#e1e2ed",
                    "outline-variant": "#c3c6d7",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#004ac6",
                    "on-tertiary-fixed": "#360f00",
                    "inverse-on-surface": "#f0f0fb",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#eeefff",
                    "surface-tint": "#0053db",
                    "on-background": "#191b23",
                    "surface-container": "#ededf9",
                    "on-surface-variant": "#434655",
                    "secondary-fixed-dim": "#c0c7d6",
                    "tertiary-fixed-dim": "#ffb596",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#151c27",
                    "on-secondary-container": "#5e6572",
                    "primary-fixed": "#dbe1ff",
                    "on-primary-fixed": "#00174b",
                    "on-secondary-fixed-variant": "#404754",
                    "surface-dim": "#d9d9e5",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary-fixed-variant": "#003ea8",
                    "surface-bright": "#faf8ff",
                    "tertiary-container": "#bc4800",
                    "primary-container": "#2563eb",
                    "secondary": "#585f6c"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter": "24px",
                    "lg": "24px",
                    "sm": "8px",
                    "margin-desktop": "32px",
                    "base": "4px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "xl": "32px",
                    "2xl": "48px"
            },
            "fontFamily": {
                    "headline-sm": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-dim flex items-center justify-center min-h-screen p-md">
<!-- Background Content Mockup (Dimmed) -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-0"></div>
<!-- Modal Container -->
<main class="relative z-10 w-full max-w-[600px] bg-surface-container-lowest border border-outline-variant rounded-lg shadow-xl overflow-hidden">
<!-- Header -->
<header class="flex items-center justify-between px-lg py-md border-b border-outline-variant">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Add Cost Entry</h1>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-base">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Form Body -->
<div class="p-lg space-y-md overflow-y-auto max-h-[calc(100vh-200px)]">
<!-- Job Selection -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Job Selection</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>
<select class="w-full pl-10 pr-lg py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
<option>#JC-102 Skyline Heights Tower</option>
<option>#JC-105 Riverstone Bridge</option>
<option>#JC-109 Metro Expansion</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Date Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Date</label>
<div class="relative">
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" type="date" value="2024-05-20"/>
</div>
<p class="text-label-sm font-label-sm text-outline">Date must be within 90 days past or 30 days future</p>
</div>
<!-- Amount Field (Error State) -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Amount</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-body-sm font-medium text-on-surface">$</span>
<input class="w-full pl-7 pr-md py-sm bg-surface-container-lowest border border-error rounded-lg text-body-sm focus:ring-2 focus:ring-error/10 focus:border-error outline-none" placeholder="0.00" type="number"/>
</div>
<p class="text-label-sm font-label-sm text-error">Amount must be greater than 0</p>
</div>
</div>
<!-- Cost Category & Subcategory -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Cost Category</label>
<div class="relative">
<select class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
<option>Direct Labor</option>
<option selected="">Materials</option>
<option>Subcontract</option>
<option>Equipment</option>
<option>Overhead</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Subcategory</label>
<div class="relative">
<select class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
<option>Structural Steel</option>
<option>Concrete Mix</option>
<option>Lumber</option>
<option>HVAC Components</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Cost Code -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Cost Code</label>
<div class="relative">
<select class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
<option>03-3000 Cast-in-Place Concrete</option>
<option>05-1200 Structural Steel Framing</option>
<option>09-9000 Painting and Coating</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Description -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">Description</label>
<span class="text-label-sm font-label-sm text-outline">0/500</span>
</div>
<textarea class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none resize-none" placeholder="Enter cost details..." rows="3"></textarea>
</div>
<!-- Attachments -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant">Attachments</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center space-y-sm bg-surface-container-low/30 hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="cloud_upload">cloud_upload</span>
<p class="text-body-sm text-on-surface-variant">Attach receipt or invoice</p>
<p class="text-label-sm text-outline">Maximum file size 10MB</p>
</div>
<!-- Example File -->
<div class="flex items-center justify-between p-sm bg-surface-container-low rounded-lg border border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="description">description</span>
<span class="text-body-sm font-medium text-on-surface">invoice_042.pdf</span>
<span class="text-label-sm text-outline">1.2 MB</span>
</div>
<button class="text-outline hover:text-error transition-colors p-xs">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<footer class="flex flex-col md:flex-row items-center justify-end gap-md px-lg py-md border-t border-outline-variant bg-surface-container-lowest">
<button class="w-full md:w-auto px-lg py-sm text-on-surface-variant font-label-md text-label-md border border-outline-variant rounded-lg hover:bg-surface-container-low transition-all">
                Cancel
            </button>
<button class="w-full md:w-auto px-lg py-sm text-primary font-label-md text-label-md rounded-lg hover:bg-primary/5 transition-all">
                Save as Draft
            </button>
<button class="w-full md:w-auto px-xl py-sm bg-primary-container text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:brightness-110 active:scale-95 transition-all">
                Submit
            </button>
</footer>
</main>
</body></html>
