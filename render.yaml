services:
  - type: web
      name: job-costing-api
          runtime: node
              plan: free
                  rootDir: job-costing-app/backend
                      buildCommand: npm install
                          startCommand: node demo-server.mjs
                              envVars:
                                    - key: NODE_ENV
                                            value: production
                                              - type: web
                                                  name: job-costing-app
                                                      runtime: static
                                                          rootDir: job-costing-app/frontend
                                                              buildCommand: "npm install && npx vite build"
                                                                  staticPublishPath: ./dist
                                                                  services:
  # ── Backend API (Node.js / Express) ────────────────────────────────────────
  - type: web
    name: job-costing-api
    runtime: node
    plan: free
    rootDir: job-costing-app/backend
    buildCommand: npm install
    startCommand: node demo-server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false            # ⚠ Set this manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: FRONTEND_URL
        fromService:
          type: web
          name: job-costing-app
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Vite static site) ────────────────────────────────────────────
  - type: web
    name: job-costing-app
    runtime: static
    rootDir: job-costing-app/frontend
        buildCommand:  "npm install && npx vite build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: job-costing-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source:  "/*"
        destination: /index.html
